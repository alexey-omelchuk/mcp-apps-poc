# Despliegue:  docker compose up -d     →  http://localhost:3001/mcp
# Parar:       docker compose down

services:
  mcp:
    build: .
    image: mcp-apps-poc:latest
    pull_policy: build        # `docker compose up -d` siempre (re)construye la imagen con el código actual
    container_name: mcp-apps-poc
    ports:
      - "${PORT:-3001}:3001"
    restart: unless-stopped

  # Opcional: túnel público para usarlo como custom connector en Claude.
  #   docker compose --profile tunnel up -d   →   docker compose logs tunnel  (ver la URL)
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://mcp:3001
    depends_on:
      - mcp
    profiles: ["tunnel"]
    restart: unless-stopped
